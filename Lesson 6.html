<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>Forms</title>
    </head>
    <body>
        
    <H1>Doctor's Appointment Form</H1>
    <p>Please fill out the following information to schedule your appointment:</p>

    <form>
        <fieldset>
            <legend>Personal Details</legend>
            <label>Your name</label><br>
            <input type="text" id="name" placeholder="Enter your full name"><br><br>
            <label>Patient ID</label><br>
            <input type="password" id="p_id" placeholder="Your secret ID"><br><br>
            <LABEL>Date of birth</LABEL><br>
            <input type="date" id="dob"><br><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Your Visit</legend>
            <label>Choose your Doctor</label><br>
            <select id="doctor">
                <option value="">--Select a Doctor--</option>
                <option value="dr-ray">Dr. Ray - General</option>
                <option value="dr-lee">Dr. Lee - Teeth</option>
                <option value="dr-sam">Dr. Sam - Eyes</option>
            </select><br><br>
            <label>Why are you visiting?</label><br>
            <input type="radio" name="reason" value="fever">Fever<br>
            <input type="radio" name="reason" value="cold">Cold<br>
            <input type="radio" name="reason" value="checkup">Checkup<br><br>
            <input type="radio" name="reason" value="toothache">Tooth Pain<br><br>
            <label>Any Notes for the Doctor</label><br>
            <textarea id="notes" rows="3" cols="35" placeholder="e.g. I have a sore throat for two days."></textarea><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>Preferred Visit Days</legend>
            <input type="checkbox" value="monday">Monday<br>
            <input type="checkbox" value="tuesday">Tuesday<br>
            <input type="checkbox" value="wednesday">Wednesday<br>
        </fieldset>
        <br>
        <input type="submit" value="Book My Appointment">
    </form>
    </body>
</html>
